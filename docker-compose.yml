services:
  db:
    image: postgres:16-alpine
    container_name: jobsy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobsy
      POSTGRES_PASSWORD: jobsy
      POSTGRES_DB: jobsy
    ports:
      - "5432:5432"
    volumes:
      - jobsy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobsy_pgdata:
